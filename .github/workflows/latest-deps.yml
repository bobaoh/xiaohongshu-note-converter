name: latest dependencies

# Early warning: every week, install the newest versions that requirements.txt allows,
# ignoring requirements.lock, and run the offline tests. A failure here means an upstream
# release would break new installs once the lock is updated; users installing from the lock
# are not affected yet. On success, each job uploads the versions it tested.
#
# Two Python versions are needed because some packages resolve differently on them
# (rapidocr-onnxruntime 1.3+ only supports Python <3.13). To refresh requirements.lock,
# take the 3.11 artifact and keep an environment-marker line pair for every package whose
# version differs in the 3.14 artifact.

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC
  workflow_dispatch:

jobs:
  latest:
    name: latest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFmpeg and OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install the newest allowed Python dependencies (no lock)
        run: python -m pip install --upgrade -r requirements-dev.txt

      - name: Compare with requirements.lock
        run: |
          python -m pip freeze --exclude-editable | sort -f > freeze.txt
          grep -v '^#' requirements.lock | grep . | sed 's/;.*//' | sort -fu > locked.txt
          echo "Packages that differ from requirements.lock (< locked, > latest):"
          diff locked.txt freeze.txt || true

      - name: Run tests
        env:
          TEST_WHISPER_MODEL: tiny
        run: python -m pytest -v

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: tested-versions-py${{ matrix.python }}
          path: freeze.txt
