name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Unit tests plus the synthetic-media tests (FFmpeg, OCR, Whisper tiny).
    # Tests marked `local` need real notes cached on a developer machine and are skipped here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install FFmpeg and OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache the Whisper tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1

      - name: Run tests
        env:
          TEST_WHISPER_MODEL: tiny
        run: python -m pytest -v
