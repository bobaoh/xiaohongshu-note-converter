name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Layer 1: unit tests plus the synthetic-media tests (FFmpeg, OCR, Whisper tiny), installed
    # from requirements.lock so this checks exactly the versions users get.
    # Tests marked `local` need real notes cached on a developer machine and are skipped here.
    name: offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}  # oldest supported
          - {os: ubuntu-latest, python: "3.14"}  # newest supported
          - {os: windows-latest, python: "3.14"} # most users run Windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.*

      - name: Install FFmpeg and OpenCV system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies from the lock file
        run: python -m pip install -r requirements-dev.txt -c requirements.lock

      - name: Show tool versions
        run: |
          python --version
          ffmpeg -version
          python -m pip freeze

      - name: Cache the pinned Whisper tiny model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # Keep in sync with WHISPER_REVISIONS["tiny"] in notekit/media.py.
          key: whisper-tiny-d90ca5fe-${{ runner.os }}

      - name: Run tests
        env:
          TEST_WHISPER_MODEL: tiny
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python -m pytest -v
