[pytest]
testpaths = tests
addopts = -m "not local"
markers =
    media: runs FFmpeg, OCR, and Whisper (tiny) on the synthetic media in tests/fixtures/synthetic (about 1 minute)
    local: runs on real notes cached in tests/fixtures/local (not committed; fetch with tests/fixtures/fetch_local.py)
    slow: the part of the local tests that reruns OCR and transcription (several minutes)
filterwarnings =
    ignore::UserWarning:huggingface_hub.*
